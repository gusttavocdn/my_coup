<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#f7f5fb">
		<title>Sem conexão</title>
		<style>
html {
	background-color: #f7f5fb;
	color: #1b1b26;
}

body {
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
	margin: 2rem;
	text-align: center;
}

button {
	display: block;
	min-height: 56px;
	padding: 0 2rem;
	margin: 2rem auto 0;
	font-size: 1.1rem;
	border: 2px solid #e0b24a;
	border-radius: 12px;
	background: #ffffff;
	color: #1b1b26;
}
		</style>
	</head>
	<body>
		<h1>Sem conexão</h1>
		<p>O Coup Online precisa de internet para abrir pela primeira vez e para jogar online.</p>
		<p>Conecte-se e toque no botão para tentar de novo.</p>
		<button type="button">Tentar de novo</button>
		<script>
document.querySelector('button').addEventListener('click', () => {
	window.location.reload();
});
		</script>
	</body>
</html>
